<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="style.css">

</head>

<body>

    <header>
        <h1><i class="fa-brands fa-github"></i> GitHub Repository Gallery</h1>
    </header>


    <!-- <section id="search-section">

        <input type="text" id="username-input" placeholder="Enter GitHub username">

        <button id="search-btn">Search</button>

    </section> -->

    <form id="search">
        <input type="text" name="name" placeholder="Username">
        <input type="number" name="limit" placeholder="Limit">
        <button type="submit">Search for Repositories</button>
    </form>


    <div id="message"></div>


    <!-- FLEX GALLERY -->
    <section id="gallery">

        <!-- Example repository card (JS will generate these dynamically) -->

        <div class="repo-card">

            <h3>
                <i class="fa-brands fa-github"></i>
                <a href="#">repository-name</a>
            </h3>

            <p>No description</p>

            <div class="repo-info">
                <strong>Created:</strong> date
            </div>

            <div class="repo-info">
                <strong>Updated:</strong> date
            </div>

            <div class="repo-info">
                <strong>Languages:</strong> JavaScript
            </div>

            <div class="repo-info">
                <strong>Watchers:</strong> 0
            </div>

        </div>

        


    </section>



    <script src="script.js" defer> </script>
</body>

</html>
